[package]
name = "pikscreen"
default-run = "pikscreen"
version = "0.1.0"
description = "Linux-first screen recordings with marker-driven smooth zooms"
authors = ["Pik Yusuf Aslan"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/pikyusufaslan/pikscreen"
homepage = "https://github.com/pikyusufaslan/pikscreen"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pikscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashpd = { version = "0.13.12", features = ["global_shortcuts", "screencast"] }
evdev = "0.13"
futures-util = "0.3"
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
pipewire = "0.10"
xcursor = "0.3"
zbus = "5.18"
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
